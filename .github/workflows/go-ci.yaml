name: GoLang Production CI

on: 
    workflow_call: 

jobs:
   verify: 
        name: Verify & Tidy
        runs-on: ubuntu-slim
        steps:
          - name: Checkout Code
            uses: actions/checkout@v4
          - name: Setup GO
            uses: actions/setup-go@v5
            with:
              go-version-file: 'go.mod'
              cache: true
          - name: Verify Dependencies
            run: |
              go mod download
              go mod tidy
              git diff --exit-code go.mod go.sum
   go-security:
    name: Vulnerability Check
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
   go-lint:
        runs-on: ubuntu-slim
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up go
              uses: actions/setup-go@v5
              with:
                go-version-file: 'go.mod'
                cache: true
            - name: Run GolangCI Lint
              uses: golangci/golangci-lint-action@v9.3.0
              with:
                version: latest