name: CI & Lint check go

on: 
    workflow_call: 

jobs:
   go-lint:
        runs-on: ubuntu-slim
        steps:
            - name: Check out code
              uses: actions/checkout@v4
            - name: Set up go
              uses: actions/setup-go@v5
              with:
                go-version: 'stable'
                cache: false
            - name: Run GolangCI Lint
              uses: golangci/golangci-lint-action@v6
              with:
                version: latest