name: Python CI

on: 
   workflow_call: 
    
jobs:
    uv-lint: 
        runs-on: ubuntu-slim
        steps:
            - name: Checkout code  
              uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
                cache-dependency-blob: "uv.lock"
            
            - name: Install dependencies and project
              run: uv sync --frozen --all-extras --dev

            - name: Run Linting using Ruff
              run: uv run ruff check