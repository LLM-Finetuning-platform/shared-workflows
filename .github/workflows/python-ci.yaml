name: Python CI

on: 
   workflow_call: 
    
jobs:
    uv-lint: 
        runs-on: ubuntu-slim
        steps:
            - name: Checkout code  
              uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                enable-cache: true
            - name: Run Linting using Ruff
              run: uvx ruff check