name: Semantic Release action

on: 
    push: 
        branches: [main]
    workflow_call: 
      secrets:
        NPM_TOKEN:
          required: false

permissions: 
  contents: write
  issues: write
  pull-requests: write
jobs:
    release:
        runs-on: ubuntu-slim
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
            

            - name: Run Semantic Release
              env:
                GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
              run: npx semantic-release

        
            
